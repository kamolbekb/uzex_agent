- id: Q03
  lang: ru
  category: sum_volume
  question: Какой объём и сколько сделок было заключено по хлопку-сырцу в 2025 году?
  sql: SELECT COUNT(*) AS deals_count, SUM(volume_units) AS total_vol, ROUND(SUM(amount_uzs),
    2) AS total_uzs FROM deals_full WHERE product_base = 'хлопок-сырец' AND year =
    2025 AND NOT is_cancelled
  not_found: false
  expected_numbers:
  - 30894.0
  - 1844729923.0
  expected_substrings: []
- id: Q04
  lang: ru
  category: top_n
  question: Какая компания (укажите ИНН и название) заняла 1 место среди покупателей
    портландцемента в 2024 году по сумме сделок в сумах?
  sql: SELECT buyer_inn, buyer_name, COUNT(*) AS deals_count, ROUND(SUM(amount_uzs),
    2) AS total_uzs FROM deals_full WHERE product_base = 'портландцемент' AND year
    = 2024 AND NOT is_cancelled GROUP BY buyer_inn, buyer_name ORDER BY total_uzs
    DESC LIMIT 1
  not_found: false
  expected_numbers:
  - 313.0
  expected_substrings:
  - '955082698'
- id: Q05
  lang: ru
  category: avg_price
  question: Какова средневзвешенная цена за 1 тонну автомобильного бензина марки АИ-92
    (с единицей измерения тонна) в 2025 году в сумах и сколько было таких сделок?
  sql: SELECT COUNT(*) AS deals_count, ROUND(SUM(amount_uzs)/SUM(volume_units), 2)
    AS weighted_avg_uzs FROM deals_full WHERE product_base = 'бензин автомобильный'
    AND brand = 'АИ-92' AND unit = 'тонна' AND year = 2025 AND NOT is_cancelled
  not_found: false
  expected_numbers:
  - 920.0
  - 14028458.23
  expected_substrings: []
